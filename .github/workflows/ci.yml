name: CI

on:
  push:
    branches: [main, astro-migration]
  pull_request:
    branches: [main]
  # Weekly run catches external link rot and Schema.org spec drift.
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC (6am PT)

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Install lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude "apps.apple.com"
            --exclude "fonts.googleapis.com"
            --exclude "fonts.gstatic.com"
            --exclude "telemetrydeck.com"
            --exclude "reportaproblem.apple.com"
            --exclude "twitter.com"
            --accept 200,204,206,301,302,308
            ./dist
          fail: false

      - name: Validate internal links (strict)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --offline
            --accept 200
            ./dist
          fail: true
