<style>
    .skip-link {
        position: absolute;
        top: -100px;
        left: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--primary-fill);
        color: var(--text-primary);
        font-family: 'Fira Sans', sans-serif;
        font-weight: 600;
        font-size: 0.9375rem;
        border-radius: 0 0 8px 8px;
        text-decoration: none;
        z-index: var(--z-skip-link);
        transition: top 200ms ease-out;
    }
    .skip-link:focus-visible {
        top: 0;
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        color: var(--text-primary);
    }

    .nav-toggle {
        display: none;
        background: transparent;
        border: 1px solid var(--ghost-border);
        color: var(--text-primary);
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 8px;
        cursor: pointer;
        transition: border-color 200ms ease-out, background 200ms ease-out;
    }
    .nav-toggle:hover {
        border-color: rgba(200, 191, 255, 0.18);
        background: rgba(200, 191, 255, 0.04);
    }
    .nav-toggle:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }
    .nav-toggle svg { display: block; margin: auto; }

    .nav-mobile { display: none; }

    /* Keep nav links on one line; prevent "How It Works" from wrapping mid-label. */
    nav .nav-links a { white-space: nowrap; }

    /* Tablet (641-1023px): tighten the gap so all 7 items + CTA fit without wrapping. */
    @media (min-width: 641px) and (max-width: 1023px) {
        nav .nav-links { gap: 1rem; }
    }

    /* Hamburger shows only on true mobile (<=640px). iPad portrait keeps full nav. */
    @media (max-width: 640px) {
        .nav-toggle { display: inline-flex; align-items: center; justify-content: center; }
        nav .nav-links { gap: 0.5rem; }

        /* Compact the nav CTA to icon-only — "App Store" text hidden,
           full label lives in the mobile overlay instead. */
        nav .nav-cta { padding: 0.625rem; gap: 0; min-width: 44px; min-height: 44px; justify-content: center; }
        nav .nav-cta-label { display: none; }

        /* Mobile overlay CTA is full-width with label visible */
        .nav-mobile-cta {
            justify-content: center;
            margin-top: 0.5rem;
        }

        .nav-mobile {
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
            position: fixed;
            top: 4.5rem;
            left: 1rem;
            right: 1rem;
            background: rgba(26, 26, 36, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--ghost-border);
            border-radius: 14px;
            padding: 0.75rem;
            z-index: var(--z-overlay);
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: opacity 200ms ease-out, transform 200ms ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .nav-mobile[aria-hidden="false"] {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .nav-mobile a {
            font-family: 'Fira Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            transition: color 200ms ease-out, background 200ms ease-out;
        }
        .nav-mobile a:hover,
        .nav-mobile a:focus-visible {
            color: var(--text-primary);
            background: rgba(200, 191, 255, 0.06);
            outline: none;
        }

        body.nav-open { overflow: hidden; }
    }

    /* Narrow phones (<=360px, e.g. older iPhone SE landscape-of-sorts): hide
       logo wordmark so the 32px icon + nav CTA + hamburger still fit. */
    @media (max-width: 360px) {
        nav .logo-text { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        .nav-mobile,
        .nav-toggle { transition: none; }
        .nav-mobile[aria-hidden="false"] { transform: none; }
    }
</style>

<script>
(function() {
    var toggle = document.querySelector('.nav-toggle');
    var panel = document.querySelector('.nav-mobile');
    if (!toggle || !panel) return;

    function setState(open) {
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.setAttribute('aria-hidden', open ? 'false' : 'true');
        document.body.classList.toggle('nav-open', open);
    }

    toggle.addEventListener('click', function() {
        setState(toggle.getAttribute('aria-expanded') !== 'true');
    });

    panel.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() { setState(false); });
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
            setState(false);
            toggle.focus();
        }
    });

    window.addEventListener('resize', function() {
        if (window.innerWidth > 768) setState(false);
    });
})();
</script>
