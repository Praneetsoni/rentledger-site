<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <style>
    /* Prose pages (privacy, terms, changelog) — long-form markdown content.
       Inherits tokens, nav, and footer from site.css. */
    main.prose { padding-top: 8rem; padding-bottom: 5rem; }

    .prose h1 {
      font-family: var(--font-display); font-style: italic; font-weight: 400;
      font-size: clamp(2.25rem, 4.5vw, 3rem);
      letter-spacing: -0.02em; line-height: 1.3;
      margin-bottom: 1.5rem;
      color: var(--rl-text);
    }
    .prose h2 {
      font-family: var(--font-display); font-style: italic; font-weight: 400;
      font-size: 1.625rem; line-height: 1.3;
      margin-top: 3rem; margin-bottom: 1rem;
      color: var(--rl-text);
    }
    .prose h3 {
      font-family: var(--font-section); font-weight: 500;
      font-size: 1.25rem; line-height: 1.4;
      margin-top: 2rem; margin-bottom: 0.75rem;
      color: var(--rl-text);
    }
    .prose p, .prose li {
      color: var(--rl-text-secondary);
      font-size: 1rem; line-height: 1.75;
      margin-bottom: 1rem;
    }
    .prose ul, .prose ol { padding-left: 1.5rem; margin-bottom: 1rem; }
    .prose li { margin-bottom: 0.5rem; }
    .prose a {
      color: var(--rl-primary);
      text-decoration: underline;
      text-decoration-color: rgba(200, 191, 255, 0.3);
      text-underline-offset: 3px;
      transition: color 200ms ease-out, text-decoration-color 200ms ease-out;
    }
    .prose a:hover { color: var(--rl-accent); text-decoration-color: currentColor; }
    .prose strong { color: var(--rl-text); font-weight: 600; }
    .prose em { color: var(--rl-text-secondary); }
    .prose code {
      font-family: var(--font-mono); font-size: 0.875em;
      background: var(--rl-surface);
      border: 1px solid var(--rl-border);
      border-radius: 4px;
      padding: 0.125rem 0.375rem;
    }
    .prose hr {
      border: none;
      border-top: 1px solid var(--rl-border);
      margin: 2.5rem 0;
    }

    .container--prose {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
  </style>
</head>
<body>
  {% include nav.html %}

  <main class="prose" id="main-content">
    <div class="container--prose">
      {{ content }}
    </div>
  </main>

  {% include footer.html %}
</body>
</html>
